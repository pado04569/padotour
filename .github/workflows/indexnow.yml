# 홈페이지가 바뀌면 Bing(IndexNow)에 바뀐 주소를 알린다. — scripts/indexnow.mjs
# Vercel 배포가 실제로 끝난 것(/api/version 이 이번 커밋이 될 때)을 확인한 뒤에 알린다.
name: IndexNow

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**"]

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 배포 완료 기다리기 (최대 15분)
        run: |
          for i in $(seq 1 45); do
            live=$(curl -s --max-time 10 "https://www.padotour.com/api/version?t=$(date +%s)" || true)
            if [ "$live" = "${{ github.sha }}" ]; then echo "배포 확인: $live"; exit 0; fi
            sleep 20
          done
          echo "배포 확인 시간 초과 — 그래도 알린다"

      - name: 바뀐 주소 알리기
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="${{ github.sha }}~1"
          fi
          node scripts/indexnow.mjs "$BEFORE" "${{ github.sha }}"
